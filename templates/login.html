{% extends "base.html" %}

{% block title %}Student Login - NOUN Exam Mock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 mb-2">Student Portal</span>
                    <h3 class="fw-bold">Student Login</h3>
                    <p class="text-muted small">Sign in with your NOUN Matric Number</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Matric Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-mortarboard"></i></span>
                            <input type="text" name="username" class="form-control form-control-lg" required autofocus placeholder="e.g. NOU123456789" style="text-transform: uppercase;">
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold mb-0">Password</label>
                            <a href="{{ url_for('reset_password') }}" class="small text-decoration-none text-muted">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" name="password" class="form-control form-control-lg" required placeholder="Enter your password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-noun btn-lg w-100 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
                <p class="text-center mt-4 mb-2">
                    Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-success">Register here</a>
                </p>
                <div class="text-center pt-3 border-top mt-3">
                    <a href="{{ url_for('staff_login') }}" class="text-muted text-decoration-none small">
                        <i class="bi bi-lock me-1"></i>Login as Admin / Teacher
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
