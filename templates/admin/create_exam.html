{% extends "base.html" %}

{% block title %}Create Exam - NOUN Exam Mock{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('admin_exams') }}">Exams</a></li>
        <li class="breadcrumb-item active">Create</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Create New Mock Exam</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Exam Title *</label>
                        <input type="text" name="title" class="form-control" required placeholder="e.g. CIT 211 - Introduction to Operating Systems">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Brief description of what this mock covers..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Course Code</label>
                            <input type="text" name="course_code" class="form-control" placeholder="e.g. CIT211">
                        </div>
                        <div class="col-md-5 mb-3">
                            <label class="form-label">Faculty</label>
                            <select name="faculty" class="form-select">
                                <option value="">-- Select --</option>
                                <option value="General Studies">General Studies</option>
                                <option value="Faculty of Computing">Faculty of Computing</option>
                                <option value="Faculty of Sciences">Faculty of Sciences</option>
                                <option value="Faculty of Arts">Faculty of Arts</option>
                                <option value="Faculty of Education">Faculty of Education</option>
                                <option value="Faculty of Management Sciences">Faculty of Management Sciences</option>
                                <option value="Faculty of Social Sciences">Faculty of Social Sciences</option>
                                <option value="Faculty of Health Sciences">Faculty of Health Sciences</option>
                                <option value="Faculty of Law">Faculty of Law</option>
                                <option value="Faculty of Agricultural Sciences">Faculty of Agricultural Sciences</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Credit Unit</label>
                            <select name="credit_units" class="form-select" required>
                                <option value="2" selected>2 Units</option>
                                <option value="3">3 Units</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Duration (mins)</label>
                            <input type="number" name="duration_minutes" class="form-control" value="30" min="5" max="180">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-noun">
                            <i class="bi bi-check-lg me-1"></i>Create Exam
                        </button>
                        <a href="{{ url_for('admin_exams') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
