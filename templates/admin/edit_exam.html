{% extends "base.html" %}

{% block title %}Edit Exam - NOUN Exam Mock{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('admin_exams') }}">Exams</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Edit Exam</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Exam Title *</label>
                        <input type="text" name="title" class="form-control" required value="{{ exam.title }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ exam.description or '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Course Code</label>
                            <input type="text" name="course_code" class="form-control" value="{{ exam.course_code or '' }}">
                        </div>
                        <div class="col-md-5 mb-3">
                            <label class="form-label">Faculty</label>
                            <select name="faculty" class="form-select">
                                <option value="">-- Select --</option>
                                {% for f in ['General Studies', 'Faculty of Computing', 'Faculty of Sciences', 'Faculty of Arts', 'Faculty of Education', 'Faculty of Management Sciences', 'Faculty of Social Sciences', 'Faculty of Health Sciences', 'Faculty of Law', 'Faculty of Agricultural Sciences'] %}
                                <option value="{{ f }}" {% if exam.faculty == f %}selected{% endif %}>{{ f }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Credit Unit</label>
                            <select name="credit_units" class="form-select">
                                <option value="2" {% if exam.credit_units == 2 %}selected{% endif %}>2 Units</option>
                                <option value="3" {% if exam.credit_units == 3 %}selected{% endif %}>3 Units</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Duration (mins)</label>
                            <input type="number" name="duration_minutes" class="form-control" value="{{ exam.duration_minutes }}" min="5" max="180">
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_published" class="form-check-input" id="published" {% if exam.is_published %}checked{% endif %}>
                        <label class="form-check-label" for="published">Published (visible to students)</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-noun">Save Changes</button>
                        <a href="{{ url_for('admin_exams') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
