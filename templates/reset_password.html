{% extends "base.html" %}

{% block title %}Reset Password - NOUN Exam Mock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2 mb-2">Account Recovery</span>
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-muted small">Enter your Matric Number or Email to set a new password</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Matric Number or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="identifier" class="form-control form-control-lg" required autofocus placeholder="e.g. NOU123456789 or email@domain.com">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" name="new_password" class="form-control form-control-lg" required placeholder="Enter new password (min. 4 chars)">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-check-circle"></i></span>
                            <input type="password" name="confirm_password" class="form-control form-control-lg" required placeholder="Repeat new password">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-warning btn-lg w-100 shadow-sm fw-bold">
                        <i class="bi bi-arrow-repeat me-2"></i>Reset & Save Password
                    </button>
                </form>
                
                <p class="text-center mt-4 mb-2">
                    Remember your password? <a href="{{ url_for('login') }}" class="fw-bold text-success">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
