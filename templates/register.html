{% extends "base.html" %}

{% block title %}Register - NOUN Exam Mock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <h3 class="text-center mb-4">Create Student Account</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" required placeholder="e.g. Chinedu Okeke">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matric Number *</label>
                        <input type="text" name="matric_no" class="form-control" required placeholder="e.g. NOU123456789" style="text-transform: uppercase;">
                        <div class="form-text">This will be your username for login</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Faculty / Department</label>
                        <select name="faculty" class="form-select">
                            <option value="">-- Select Faculty --</option>
                            <option value="General Studies">General Studies</option>
                            <option value="Faculty of Computing">Faculty of Computing</option>
                            <option value="Faculty of Sciences">Faculty of Sciences</option>
                            <option value="Faculty of Arts">Faculty of Arts</option>
                            <option value="Faculty of Education">Faculty of Education</option>
                            <option value="Faculty of Management Sciences">Faculty of Management Sciences</option>
                            <option value="Faculty of Social Sciences">Faculty of Social Sciences</option>
                            <option value="Faculty of Health Sciences">Faculty of Health Sciences</option>
                            <option value="Faculty of Law">Faculty of Law</option>
                            <option value="Faculty of Agricultural Sciences">Faculty of Agricultural Sciences</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-noun btn-lg w-100">
                        <i class="bi bi-person-plus me-2"></i>Register
                    </button>
                </form>
                <p class="text-center mt-4 mb-0">
                    Already have an account? <a href="{{ url_for('login') }}">Login with Matric Number</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
