{% extends "base.html" %}

{% block title %}Admin / Teacher Login - NOUN Exam Mock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Staff Portal Login</h4>
                <small class="text-white-50">Admin & Teacher Access</small>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Staff Username / Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input type="text" name="username" class="form-control form-control-lg" required autofocus placeholder="e.g. admin or teacher1">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control form-control-lg" required placeholder="Enter password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login as Staff
                    </button>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">Are you a student?</span><br>
                    <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Go to Student Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
